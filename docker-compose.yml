version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ofinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofinance_admin
      POSTGRES_PASSWORD: change_me_local_password
      POSTGRES_DB: ofinance_core
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofinance_admin -d ofinance_core"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: