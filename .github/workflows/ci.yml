name: O-Finance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-verify:
    name: Frontend Verification (Bun + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies via Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run deterministic finance unit tests
        run: bun run test

      - name: Run TypeScript type check
        run: bun run lint

      - name: Build production bundle
        run: bun run build

  backend-test:
    name: Backend Verification (Python 3.12 + FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ofinance_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: ofinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofinance_test -d ofinance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure test database URL
        run: |
          echo "OFINANCE_TEST_DATABASE_URL=postgresql+psycopg://ofinance_test:local_test_only@localhost:5432/ofinance_test" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql+psycopg://ofinance_test:local_test_only@localhost:5432/ofinance_test" >> $GITHUB_ENV

      - name: Verify Python syntax
        run: |
          python -m py_compile app/main.py app/core/*.py app/schemas/*.py app/models/*.py app/services/*.py app/api/v1/*.py app/assistant/*.py app/ledger/*.py tests/*.py migrations/*.py migrations/versions/*.py

      - name: Run database migrations via Alembic
        run: |
          alembic upgrade head

      - name: Run backend pytest suite (unit & integration)
        run: pytest -v
