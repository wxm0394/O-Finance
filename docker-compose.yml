version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ofinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofinance_admin
      POSTGRES_PASSWORD: change_me_local_password
      POSTGRES_DB: ofinance_core
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofinance_admin -d ofinance_core"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ofinance-core:
    build: .
    container_name: ofinance-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USE_SQLITE_FALLBACK: "false"
      DATABASE_URL: "postgresql://ofinance_admin:change_me_local_password@postgres:5432/ofinance_core"
      VITE_API_BASE_URL: "http://localhost:8000"
      VITE_DEMO_MODE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./ledger:/app/ledger

volumes:
  postgres_data:
